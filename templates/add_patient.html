<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="page-shell">
        <section class="auth-card auth-card-wide">
            <div class="brand-block">
                <span class="brand-badge">Patient Management</span>
                <h1>Add New Patient</h1>
                <p>Register a new patient with validated demographic details.</p>
            </div>

            {% if message %}
            <div class="alert {{ message_type }}">{{ message }}</div>
            {% endif %}

            <form method="post" class="login-form">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter patient full name" required>

                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="1" max="120" placeholder="Enter age" required>

                <label for="gender">Gender</label>
                <div class="select-wrap">
                    <select id="gender" name="gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" minlength="8" maxlength="15" placeholder="Enter phone number"
                    required>

                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Enter address" required>

                <button type="submit">Save Patient</button>
            </form>

            <div class="support-text">
                <a href="{{ url_for('patient.patient_list') }}">View patient list</a> |
                <a href="{{ url_for('dashboard.receptionist_dashboard') }}">Back to dashboard</a>
            </div>
        </section>
    </main>
</body>

</html>
